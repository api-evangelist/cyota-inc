name: Cyota, Inc
description: 'Cyota, Inc was a cybersecurity company founded in 1999 in New York City by Naftali Bennett,
  Lior Golan, Michal Tzur, and Amir Orad, focused on online banking fraud, e-commerce fraud, and
  anti-phishing protection. Cyota pioneered token-less consumer authentication and risk-based fraud
  detection for financial institutions, reportedly holding a majority share of the US and UK
  e-commerce authentication markets. Backed by Bessemer Venture Partners, the company was acquired by
  RSA Security on December 30, 2005 for approximately $145 million, after which its technology was
  folded into RSA''s Identity and Fraud portfolio (RSA Adaptive Authentication / FraudAction). Cyota
  no longer operates as an independent entity and publishes no live developer surface, API, or
  documentation. This profile is retained for historical/network provenance only.'
